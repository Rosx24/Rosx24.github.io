<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gracias por participar</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #000000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .section {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .main-text {
    color: #ffffff;
    font-size: 3rem;
    letter-spacing: 2px;
    line-height: 1.8;
  }

  .hidden-text {
    color: #000000;
    background-color: #000000;
    font-size: 2rem;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="section">
    <div class="main-text">Gracias<br><br>Por participar</div>
  </div>

  <div class="section">
    <div class="hidden-text">Nos veremos pronto 🐇</div>
  </div>

</body>
</html>
